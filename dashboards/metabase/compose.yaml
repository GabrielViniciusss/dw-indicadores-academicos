# Ambiente demonstrativo isolado; não usa o MySQL existente da máquina.
name: dw-academico-paineis
services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${DW_ROOT_PASSWORD:?Defina DW_ROOT_PASSWORD}
      MYSQL_DATABASE: dw_academico
      MYSQL_USER: painel
      MYSQL_PASSWORD: ${DW_PASSWORD:?Defina DW_PASSWORD}
    volumes:
      - dw_mysql:/var/lib/mysql
      - ../../sql/01_ddl.sql:/docker-entrypoint-initdb.d/01_ddl.sql:ro
      - ../../sql/02_dados_sinteticos.sql:/docker-entrypoint-initdb.d/02_dados_sinteticos.sql:ro
      - ../../sql/03_carga_fato_agregada.sql:/docker-entrypoint-initdb.d/03_carga_fato_agregada.sql:ro
      - ../../sql/04_views.sql:/docker-entrypoint-initdb.d/04_views.sql:ro
    healthcheck:
      test: [CMD, mysqladmin, ping, -h, localhost]
      interval: 10s
      timeout: 5s
      retries: 30
  metabase:
    image: metabase/metabase:v0.64.1
    ports:
      - 127.0.0.1:${METABASE_PORT:-3033}:3000
    environment:
      MB_DB_FILE: /metabase-data/metabase.db
    volumes:
      - dw_metabase:/metabase-data
    depends_on:
      mysql:
        condition: service_healthy
volumes:
  dw_mysql:
  dw_metabase:
